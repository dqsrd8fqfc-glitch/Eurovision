  function mapRoomBundle(roomRow, usersRows, scoresRows, commentsRows, scoreEventRows, likesRows) {
    var room = {
      name: roomRow.name,
      createdAt: new Date(roomRow.created_at).getTime(),
      users: {},
      scores: {},
      comments: {},
      scoreEvents: {}
    };

    for (var i = 0; i < usersRows.length; i++) {
      var u = usersRows[i];
      room.users[u.id] = {
        id: u.id,
        name: u.name,
        joinedAt: new Date(u.joined_at).getTime()
      };
    }

    for (var j = 0; j < scoresRows.length; j++) {
      var s = scoresRows[j];
      if (!room.scores[s.user_id]) room.scores[s.user_id] = {};
      room.scores[s.user_id][s.country_code] = s.points;
    }

    for (var k = 0; k < commentsRows.length; k++) {
      var c = commentsRows[k];
      room.comments[c.id] = {
        id: c.id,
        userId: c.user_id,
        userName: c.user_name,
        country: c.country,
        text: c.text,
        createdAt: new Date(c.created_at).getTime(),
        likes: {}
      };
    }

    for (var m = 0; m < scoreEventRows.length; m++) {
      var e = scoreEventRows[m];
      room.scoreEvents[e.id] = {
        id: e.id,
        userId: e.user_id,
        userName: e.user_name,
        country: e.country,
        points: e.points,
        prev: e.prev,
        createdAt: new Date(e.created_at).getTime()
      };
    }

    for (var n = 0; n < likesRows.length; n++) {
      var like = likesRows[n];
      if (room.comments[like.comment_id]) {
        room.comments[like.comment_id].likes[like.user_id] = new Date(like.created_at).getTime();
      }
    }

    return room;
  }

  async function fetchRoomFromCloud(code) {
    var roomRes = await db.from('rooms').select('*').eq('code', code).maybeSingle();
    if (roomRes.error) throw roomRes.error;
    if (!roomRes.data) return null;

    var usersRes = await db.from('users').select('*').eq('room_code', code);
    if (usersRes.error) throw usersRes.error;

    var scoresRes = await db.from('scores').select('*').eq('room_code', code);
    if (scoresRes.error) throw scoresRes.error;

    var commentsRes = await db.from('comments').select('*').eq('room_code', code);
    if (commentsRes.error) throw commentsRes.error;

    var eventsRes = await db.from('score_events').select('*').eq('room_code', code);
    if (eventsRes.error) throw eventsRes.error;

    var commentIds = (commentsRes.data || []).map(function(c) { return c.id; });
    var likesRows = [];

    if (commentIds.length > 0) {
      var likesRes = await db
        .from('comment_likes')
        .select('comment_id,user_id,created_at')
        .in('comment_id', commentIds);

      if (likesRes.error) throw likesRes.error;
      likesRows = likesRes.data || [];
    }

    return mapRoomBundle(
      roomRes.data,
      usersRes.data || [],
      scoresRes.data || [],
      commentsRes.data || [],
      eventsRes.data || [],
      likesRows
    );
  }

  async function refreshActiveRoom() {
    if (!state.activeRoomCode) return;
    var room = await fetchRoomFromCloud(state.activeRoomCode);
    if (!room) return;
    if (!state.store.rooms) state.store.rooms = {};
    state.store.rooms[state.activeRoomCode] = room;
  }

  function activeRoom() {
    if (!state.activeRoomCode) return null;
    return (state.store.rooms || {})[state.activeRoomCode] || null;
  }

  function genRoomCode() {
    var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
    for (var attempt = 0; attempt < 30; attempt++) {
      var code = '';
      for (var i = 0; i < 4; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
      if (!(state.store.rooms && state.store.rooms[code])) return code;
    }
    return 'R' + Date.now().toString(36).slice(-3).toUpperCase();
  }

  function readHashRoom() {
    var h = String(window.location.hash || '').replace(/^#/, '').trim().toUpperCase();
    return /^[A-Z0-9]{3,8}$/.test(h) ? h : null;
  }

  function writeHashRoom(code) {
    try {
      if (code) window.history.replaceState(null, '', '#' + code);
      else window.history.replaceState(null, '', window.location.pathname + window.location.search);
    } catch (e) {}
  }

    store: loadStore(),

    activeRoomCode: null,
    lobbyStage: 'choose',
    pendingRoomCode: null,

    view: 'welcome',
    activeCountry: null,
    profileUserId: null,
    tab: 'countries',
    boardTab: 'countries',

  var roomSubscription = null;
  var roomRefreshTimer = null;

  function nameToId(name) {
    var s = String(name || '').trim().toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
    return s || ('guest_' + Math.random().toString(36).slice(2, 8));
  }

  function genId(prefix) {
    return prefix + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6);
  }

  function escapeHTML(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function formatRel(ts) {
    var d = Date.now() - ts;
    if (d < 30000) return 'just now';
    if (d < 60000) return Math.floor(d / 1000) + 's';
    if (d < 3600000) return Math.floor(d / 60000) + 'm';
    if (d < 86400000) return Math.floor(d / 3600000) + 'h';
    return Math.floor(d / 86400000) + 'd';
  }

  function pivotScores() {
    var byCountry = {};
    var room = activeRoom();
    var su = room ? (room.scores || {}) : {};
    for (var uid in su) {
      var us = su[uid] || {};
      for (var cc in us) {
        if (!byCountry[cc]) byCountry[cc] = {};
        byCountry[cc][uid] = us[cc];
      }
    }
    return byCountry;
  }

  function stopRoomSubscription() {
    if (roomSubscription) {
      db.removeChannel(roomSubscription);
      roomSubscription = null;
    }
    if (roomRefreshTimer) {
      clearTimeout(roomRefreshTimer);
      roomRefreshTimer = null;
    }
  }

  function startRoomSubscription() {
    stopRoomSubscription();
    if (!state.activeRoomCode) return;

    function queueRefresh() {
      if (roomRefreshTimer) clearTimeout(roomRefreshTimer);
      roomRefreshTimer = setTimeout(async function() {
        try {
          await refreshActiveRoom();
          render();
        } catch (e) {
          console.error('Realtime refresh failed', e);
        }
      }, 150);
    }

    roomSubscription = db
      .channel('room-' + state.activeRoomCode)
      .on('postgres_changes', {
        event: '*',
        schema: 'public',
        table: 'users',
        filter: 'room_code=eq.' + state.activeRoomCode
      }, queueRefresh)
      .on('postgres_changes', {
        event: '*',
        schema: 'public',
        table: 'scores',
        filter: 'room_code=eq.' + state.activeRoomCode
      }, queueRefresh)
      .on('postgres_changes', {
        event: '*',
        schema: 'public',
        table: 'comments',
        filter: 'room_code=eq.' + state.activeRoomCode
      }, queueRefresh)
      .on('postgres_changes', {
        event: '*',
        schema: 'public',
        table: 'score_events',
        filter: 'room_code=eq.' + state.activeRoomCode
      }, queueRefresh)
      .on('postgres_changes', {
        event: '*',
        schema: 'public',
        table: 'comment_likes'
      }, queueRefresh)
      .subscribe(function(status) {
        console.log('Realtime status:', status);
      });
  }

  async function joinUser(rawName) {
    var nm = String(rawName || '').trim();
    if (!nm || !state.activeRoomCode) return;

    var id = nameToId(nm);
    var u = { id: id, name: nm, joinedAt: Date.now() };

    var res = await db.from('users').upsert({
      id: id,
      room_code: state.activeRoomCode,
      name: nm
    });

    if (res.error) {
      alert('Could not join room right now.');
      return;
    }

    state.user = u;
    saveSessionUser(u);
    await refreshActiveRoom();
    startRoomSubscription();
    state.view = 'main';
    render();
  }

  function resumeUser(u) {
    if (!u) return;
    state.user = u;
    saveSessionUser(u);
    startRoomSubscription();
    state.view = 'main';
    render();
  }

    clearSessionUser();
    state.user = null;
    state.view = 'welcome';

    clearSessionUser();

  async function createRoom(name) {
    var code = genRoomCode();
    var roomName = String(name || '').trim() || ('Room ' + code);

    var res = await db.from('rooms').insert({
      code: code,
      name: roomName
    });

    if (res.error) {
      state.lobbyError = 'Could not create room. Try again.';
      render();
      return;
    }

    state.activeRoomCode = code;
    state.pendingRoomCode = null;
    state.lobbyStage = 'name';
    state.lobbyError = '';
    saveSessionRoom(code);
    writeHashRoom(code);

    await refreshActiveRoom();
    startRoomSubscription();
    render();
  }

  async function joinRoom(rawCode) {
    var code = String(rawCode || '').trim().toUpperCase();

    if (!code) {
      state.lobbyError = 'Enter a room code.';
      render();
      return;
    }

    try {
      var room = await fetchRoomFromCloud(code);

      if (!room) {
        state.lobbyError = 'No room with that code. Check with whoever shared it.';
        render();
        return;
      }

      if (!state.store.rooms) state.store.rooms = {};
      state.store.rooms[code] = room;
      state.activeRoomCode = code;
      state.pendingRoomCode = null;
      state.lobbyStage = 'name';
      state.lobbyError = '';
      saveSessionRoom(code);
      writeHashRoom(code);
      startRoomSubscription();
      render();
    } catch (err) {
      state.lobbyError = 'Join failed: ' + (err && err.message ? err.message : String(err));
      render();
    }
  }

  async function setScore(countryCode, points) {
    if (!state.user || !state.activeRoomCode) return;

    var uid = state.user.id;
    var prev = activeRoom().scores[uid] ? activeRoom().scores[uid][countryCode] : null;

    if (points === null) {
      var delRes = await db
        .from('scores')
        .delete()
        .eq('room_code', state.activeRoomCode)
        .eq('user_id', uid)
        .eq('country_code', countryCode);

      if (delRes.error) {
        alert('Could not clear score right now.');
        return;
      }
    } else {
      var scoreRes = await db.from('scores').upsert({
        room_code: state.activeRoomCode,
        user_id: uid,
        country_code: countryCode,
        points: points
      });

      if (scoreRes.error) {
        alert('Could not save score right now.');
        return;
      }

      if (prev !== points) {
        await db.from('score_events').insert({
          id: genId('s'),
          room_code: state.activeRoomCode,
          user_id: state.user.id,
          user_name: state.user.name,
          country: countryCode,
          points: points,
          prev: (prev != null ? prev : null)
        });
      }
    }

    await refreshActiveRoom();
    render();
  }

  async function postComment(countryCode, text) {
    if (!state.user || !state.activeRoomCode) return;

    var t = String(text || '').trim();
    if (!t) return;

    var res = await db.from('comments').insert({
      id: genId('c'),
      room_code: state.activeRoomCode,
      user_id: state.user.id,
      user_name: state.user.name,
      country: countryCode,
      text: t.slice(0, 280)
    });

    if (res.error) {
      alert('Could not post comment right now.');
      return;
    }

    state.draftComment = '';
    await refreshActiveRoom();
    render();
  }

  async function toggleLike(cid) {
    if (!state.user) return;

    var comment = activeRoom().comments[cid];
    if (!comment) return;

    var alreadyLiked = comment.likes && comment.likes[state.user.id];

    if (alreadyLiked) {
      var delRes = await db
        .from('comment_likes')
        .delete()
        .eq('comment_id', cid)
        .eq('user_id', state.user.id);

      if (delRes.error) {

        return;

    } else {

        comment_id: cid,
        user_id: state.user.id
      });

      if (insRes.error) {
        alert('Could not like comment right now.');
        return;

    }

    await refreshActiveRoom();
    render();
  }

    return headerHTML + '<main>' + bodyHTML + '</main>';
  }

  function renderPlayersStrip() {
    var room = activeRoom();
    var users = room ? (room.users || {}) : {};
    var me = state.user ? state.user.id : null;

    var lastActive = {};
    var se = room ? (room.scoreEvents || {}) : {};
    for (var sk in se) {
      var ev = se[sk];
      if (ev.userId && (lastActive[ev.userId] == null || ev.createdAt > lastActive[ev.userId])) {
        lastActive[ev.userId] = ev.createdAt;
      }
    }
    var cm = room ? (room.comments || {}) : {};
    for (var ck in cm) {
      var c = cm[ck];
      if (c.userId && (lastActive[c.userId] == null || c.createdAt > lastActive[c.userId])) {
        lastActive[c.userId] = c.createdAt;
      }
    }

    var others = [];
    for (var uid in users) {
      if (uid === me) continue;
      var u = users[uid];
      others.push({
        id: uid,
        name: u.name,
        joinedAt: u.joinedAt || 0,
        lastActive: lastActive[uid] || u.joinedAt || 0
      });
    }
    if (others.length === 0) return '';

    others.sort(function(a, b) { return b.lastActive - a.lastActive; });

    var pillsHTML = others.map(function(p) {
      var initial = p.name ? p.name.charAt(0).toUpperCase() : '?';
      var isActive = (Date.now() - p.lastActive) < 5 * 60000;
      return '' +
        '<button class="player-chip" data-profile="' + escapeHTML(p.id) + '" title="' + escapeHTML(p.name) + '">' +
          '<span class="player-chip-avatar">' + escapeHTML(initial) +
            (isActive ? '<span class="player-chip-pulse"></span>' : '') +
          '</span>' +
          '<span class="player-chip-name">' + escapeHTML(p.name) + '</span>' +
        '</button>';
    }).join('');

    return '' +
      '<div class="players-strip">' +
        '<div class="players-strip-scroll">' + pillsHTML + '</div>' +
      '</div>';
  }

  function tabHTML(id, label, count) {
    var countHTML = count !== null ? '<span class="count">' + count + '</span>' : '';
    return '<button class="tab' + (state.tab === id ? ' active' : '') + '" data-tab="' + id + '">' + label + countHTML + '</button>';
  }

  function renderCountriesList() {
    var room = activeRoom();
    var byCountry = pivotScores();
    var commentsByCountry = {};
    var allCmts = room.comments || {};
    for (var k in allCmts) {
      var c = allCmts[k];
      commentsByCountry[c.country] = (commentsByCountry[c.country] || 0) + 1;
    }

    var countriesSorted = COUNTRIES.slice().sort(function(a, b) {
      var aSm = byCountry[a.code] || {};
      var bSm = byCountry[b.code] || {};
      var aVoted = aSm[state.user.id] != null ? 1 : 0;
      var bVoted = bSm[state.user.id] != null ? 1 : 0;
      if (aVoted !== bVoted) return aVoted - bVoted;
      return (a.running || 999) - (b.running || 999);
    });

    var votedSeen = false;
    var rows = countriesSorted.map(function(country, i) {
      var sMap = byCountry[country.code] || {};
      var keys = Object.keys(sMap);
      var total = 0;
      for (var j = 0; j < keys.length; j++) total += sMap[keys[j]];
      var avg = keys.length ? (total / keys.length) : 0;
      var myScore = sMap[state.user.id] != null ? sMap[state.user.id] : null;
      var cmtCount = commentsByCountry[country.code] || 0;

      var subHTML;
      if (country.artist === 'TBA') subHTML = '<span class="country-tba">artist tba</span>';
      else {
        subHTML = '<span class="artist">' + escapeHTML(country.artist) + '</span>';
        if (country.song !== 'TBA') subHTML += '<span style="color:rgba(255,255,255,0.4)"> · ' + escapeHTML(country.song) + '</span>';
      }

      var statHTML;
      if (keys.length > 0) {
        statHTML =
          '<div class="stat-num">' + avg.toFixed(1) + '</div>' +
          '<div class="stat-label">' + keys.length + ' ' + (keys.length === 1 ? 'vote' : 'votes') + '</div>';
      } else {
        statHTML = '<div class="no-vote">no votes</div>';
      }

      var myBadgeHTML = '';
      if (myScore !== null) {
        myBadgeHTML = '<div class="my-badge' + (myScore === 12 ? ' douze' : '') + '">' + myScore + '</div>';
      }

      var cmtBadgeHTML = cmtCount > 0 ? '<span class="cmt-badge">💬 ' + cmtCount + '</span>' : '';

      var dividerHTML = '';
      if (myScore !== null && !votedSeen) {
        votedSeen = true;
        dividerHTML = '<div class="list-divider">Already voted</div>';
      }

      return dividerHTML +
        '<button class="country-card fade" data-country="' + country.code + '" style="animation-delay:' + Math.min(i * 14, 500) + 'ms">' +
          '<div class="country-row">' +
            '<div class="run-num">' + (country.running || '?') + '</div>' +
            '<div class="flag">' + country.flag + '</div>' +
            '<div class="country-info">' +
              '<div style="display:flex;align-items:baseline">' +
                '<div class="country-name">' + escapeHTML(country.name) + '</div>' +
                cmtBadgeHTML +
              '</div>' +
              '<div class="country-sub">' + subHTML + '</div>' +
            '</div>' +
            '<div class="country-stats">' + statHTML + '</div>' +
          '</div>' +
          myBadgeHTML +
        '</button>';
    }).join('');

    return '<div class="list-wrap">' + rows + '</div>';
  }

  function renderBoardSubTabs() {
    return '' +
      '<div class="subtabs">' +
        '<button class="subtab' + (state.boardTab === 'countries' ? ' active' : '') + '" data-board-tab="countries">Countries</button>' +
        '<button class="subtab' + (state.boardTab === 'players' ? ' active' : '') + '" data-board-tab="players">Players</button>' +
      '</div>';
  }

  function renderBoardCountries() {
    var byCountry = pivotScores();
    var ranked = COUNTRIES.map(function(c) {
      var sMap = byCountry[c.code] || {};
      var keys = Object.keys(sMap);
      var total = 0;
      for (var i = 0; i < keys.length; i++) total += sMap[keys[i]];
      var avg = keys.length ? (total / keys.length) : 0;
      return { country: c, total: total, avg: avg, voters: keys.length };
    }).filter(function(r) { return r.voters > 0; });
    ranked.sort(function(a, b) { return b.total - a.total || b.avg - a.avg; });

    if (ranked.length === 0) {
      return '<div class="empty"><div class="ico">🎤</div><div class="ttl">No votes yet</div><div class="sub">Tap a country to drop the first douze points.</div></div>';
    }

    var top = ranked[0];
    var trophyHTML =
      '<div class="trophy fade">' +
        '<div class="trophy-tag">🏆 Leading</div>' +
        '<div class="trophy-row">' +
          '<div class="trophy-rank">#1</div>' +
          '<div class="trophy-flag">' + top.country.flag + '</div>' +
          '<div class="trophy-info">' +
            '<div class="trophy-name">' + escapeHTML(top.country.name) + '</div>' +
            '<div class="trophy-sub">' + escapeHTML(top.country.artist) + (top.country.song !== 'TBA' ? ' · ' + escapeHTML(top.country.song) : '') + '</div>' +
          '</div>' +
          '<div class="trophy-pts"><div class="n">' + top.total + '</div><div class="l">points</div></div>' +
        '</div>' +
      '</div>';

    var restHTML = ranked.slice(1).map(function(r, i) {
      return '' +
        '<div class="rank-row fade" style="animation-delay:' + (i * 14) + 'ms">' +
          '<div class="rank-num">' + (i + 2) + '</div>' +
          '<div class="rank-flag">' + r.country.flag + '</div>' +
          '<div class="rank-info">' +
            '<div class="rank-name">' + escapeHTML(r.country.name) + '</div>' +
            '<div class="rank-sub">avg ' + r.avg.toFixed(1) + ' · ' + r.voters + ' ' + (r.voters === 1 ? 'vote' : 'votes') + '</div>' +
          '</div>' +
          '<div class="rank-pts">' + r.total + '</div>' +
        '</div>';
    }).join('');

    var rankingLabel = ranked.length > 1 ? '<div class="section-label" style="margin:14px 0 8px;padding-left:4px">Ranking</div>' : '';
    return trophyHTML + rankingLabel + restHTML;
  }

  function renderBoardPlayers() {
    var room = activeRoom();
    var users = room.users || {};
    var scoresByUser = room.scores || {};
    var comments = room.comments || {};

    var playerList = [];
    for (var uid in users) {
      var u = users[uid];
      var us = scoresByUser[uid] || {};
      var scoreKeys = Object.keys(us);
      var cmtCount = 0;
      for (var ck in comments) if (comments[ck].userId === uid) cmtCount++;
      var douze = [];
      for (var dk = 0; dk < scoreKeys.length; dk++) {
        if (us[scoreKeys[dk]] === 12) {
          var ctry = COUNTRIES_BY_CODE[scoreKeys[dk]];
          if (ctry) douze.push(ctry);
        }
      }
      playerList.push({
        id: uid, name: u.name, joinedAt: u.joinedAt || 0,
        scored: scoreKeys.length, cmtCount: cmtCount, douze: douze
      });
    }

    playerList.sort(function(a, b) {
      if (b.scored !== a.scored) return b.scored - a.scored;
      return a.joinedAt - b.joinedAt;
    });

    if (playerList.length === 0) {
      return '<div class="empty"><div class="ico">🎤</div><div class="ttl">No players yet</div><div class="sub">Share the link to get people in.</div></div>';
    }

    var rowsHTML = playerList.map(function(p, idx) {
      var initial = p.name ? p.name.charAt(0).toUpperCase() : '?';
      var statsTxt = p.scored === 0 ? 'not voted yet' : (p.scored + '/' + COUNTRIES.length + ' scored');
      if (p.cmtCount > 0) statsTxt += ' · ' + p.cmtCount + ' comment' + (p.cmtCount === 1 ? '' : 's');
      var douzeHTML = '';
      if (p.douze.length > 0) {
        var flagsHTML = p.douze.slice(0, 3).map(function(c) { return '<span class="fl">' + c.flag + '</span>'; }).join('');
        if (p.douze.length > 3) flagsHTML += '<span class="more">+' + (p.douze.length - 3) + '</span>';
        douzeHTML = '<div class="player-douze"><span class="lbl">12</span>' + flagsHTML + '</div>';
      }
      var meCls = p.id === state.user.id ? ' me' : '';
      return '' +
        '<button class="player-row fade' + meCls + '" data-profile="' + escapeHTML(p.id) + '" style="animation-delay:' + (idx * 20) + 'ms">' +
          '<div class="player-avatar">' + escapeHTML(initial) + '</div>' +
          '<div class="player-info">' +
            '<div class="player-name">' + escapeHTML(p.name) + (p.id === state.user.id ? ' <span class="you-tag">you</span>' : '') + '</div>' +
            '<div class="player-stats">' + escapeHTML(statsTxt) + '</div>' +
          '</div>' +
          douzeHTML +
        '</button>';
    }).join('');

    return '<div class="players-list">' + rowsHTML + '</div>';
  }

  function renderLeaderboard() {
    var inner = state.boardTab === 'players' ? renderBoardPlayers() : renderBoardCountries();
    return '<div class="lead-wrap">' + renderBoardSubTabs() + inner + '</div>';
  }

  function renderProfile() {
    var room = activeRoom();
    var pid = state.profileUserId;
    var u = room.users[pid];
    if (!u) {
      return '' +
        '<header class="header"><div class="detail-header">' +
          '<button id="back-btn" class="icon-btn" aria-label="Back">' +
            '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>' +
          '</button>' +
          '<div class="detail-header-title"><span class="name">Profile</span></div>' +
        '</div></header>' +
        '<main><div class="empty"><div class="ico">👻</div><div class="ttl">Player not found</div></div></main>';
    }

    var isMe = pid === state.user.id;
    var initial = u.name ? u.name.charAt(0).toUpperCase() : '?';

    var theirScores = room.scores[pid] || {};
    var scoreList = [];
    for (var cc in theirScores) {
      var country = COUNTRIES_BY_CODE[cc];
      if (country) scoreList.push({ country: country, score: theirScores[cc] });
    }
    scoreList.sort(function(a, b) {
      if (b.score !== a.score) return b.score - a.score;
      return (a.country.running || 999) - (b.country.running || 999);
    });

    var theirComments = [];
    var allCmts = room.comments;
    for (var ck in allCmts) if (allCmts[ck].userId === pid) theirComments.push(allCmts[ck]);
    theirComments.sort(function(a, b) { return b.createdAt - a.createdAt; });

    var totalPointsAwarded = 0;
    for (var i = 0; i < scoreList.length; i++) totalPointsAwarded += scoreList[i].score;
    var totalUpvotesReceived = 0;
    for (var ci = 0; ci < theirComments.length; ci++) {
      var likes = theirComments[ci].likes || {};
      for (var lk in likes) totalUpvotesReceived++;
    }

    var scoresHTML = '';
    if (scoreList.length === 0) {
      scoresHTML = '<div class="profile-empty">No scores yet.</div>';
    } else {
      scoresHTML = scoreList.map(function(s) {
        var is12 = s.score === 12;
        return '' +
          '<button class="profile-score-card" data-country="' + s.country.code + '">' +
            '<div class="profile-score-flag">' + s.country.flag + '</div>' +
            '<div class="profile-score-info">' +
              '<div class="profile-score-name">' + escapeHTML(s.country.name) + '</div>' +
              '<div class="profile-score-meta">#' + (s.country.running || '?') + (s.country.artist !== 'TBA' ? ' · ' + escapeHTML(s.country.artist) : '') + '</div>' +
            '</div>' +
            '<div class="profile-score-pts' + (is12 ? ' douze' : '') + '">' + s.score + '</div>' +
          '</button>';
      }).join('');
    }

    var commentsHTML = '';
    if (theirComments.length === 0) {
      commentsHTML = '<div class="profile-empty">No hot takes yet.</div>';
    } else {
      commentsHTML = theirComments.map(function(cm) {
        var ctry = COUNTRIES_BY_CODE[cm.country];
        var likes = cm.likes || {};
        var likeCount = 0;
        for (var lk in likes) likeCount++;
        return '' +
          '<button class="profile-comment" data-country="' + cm.country + '">' +
            '<div class="profile-comment-head">' +
              '<span class="profile-comment-flag">' + (ctry ? ctry.flag : '') + '</span>' +
              '<span class="profile-comment-on">' + (ctry ? escapeHTML(ctry.name) : 'Unknown') + '</span>' +
              '<span class="profile-comment-time">' + formatRel(cm.createdAt) + '</span>' +
            '</div>' +
            '<div class="profile-comment-text">' + escapeHTML(cm.text) + '</div>' +
            (likeCount > 0 ? '<div class="profile-comment-likes">♥ ' + likeCount + '</div>' : '') +
          '</button>';
      }).join('');
    }

    var upvotesGiven = 0;
    var upvotedCommentsHTML = '';
    if (isMe) {
      var upvotedList = [];
      for (var uk in allCmts) {
        var cm2 = allCmts[uk];
        if (cm2.userId !== pid && cm2.likes && cm2.likes[pid]) {
          upvotedList.push({ comment: cm2, when: cm2.likes[pid] });
        }
      }
      upvotedList.sort(function(a, b) { return b.when - a.when; });
      upvotesGiven = upvotedList.length;

      if (upvotedList.length > 0) {
        upvotedCommentsHTML = upvotedList.map(function(item) {
          var cm = item.comment;
          var ctry = COUNTRIES_BY_CODE[cm.country];
          return '' +
            '<button class="profile-comment liked" data-country="' + cm.country + '">' +
              '<div class="profile-comment-head">' +
                '<span class="profile-comment-flag">' + (ctry ? ctry.flag : '') + '</span>' +
                '<span class="profile-comment-author">' + escapeHTML(cm.userName).toUpperCase() + '</span>' +
                '<span class="profile-comment-on">on ' + (ctry ? escapeHTML(ctry.name) : 'Unknown') + '</span>' +
                '<span class="profile-comment-time">' + formatRel(cm.createdAt) + '</span>' +
              '</div>' +
              '<div class="profile-comment-text">' + escapeHTML(cm.text) + '</div>' +
            '</button>';
        }).join('');
      } else {
        upvotedCommentsHTML = '<div class="profile-empty">You haven\'t liked any comments yet.</div>';
      }
    }

    var logoutHTML = isMe
      ? '<button id="logout-btn" class="profile-logout">Sign out</button>'
      : '';

    return '' +
      '<header class="header">' +
        '<div class="detail-header">' +
          '<button id="back-btn" class="icon-btn" aria-label="Back">' +
            '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>' +
          '</button>' +
          '<div class="detail-header-title"><span class="name">' + (isMe ? 'My Profile' : escapeHTML(u.name)) + '</span></div>' +
        '</div>' +
      '</header>' +
      '<main>' +
        '<div class="profile-hero fade">' +
          '<div class="profile-avatar">' + escapeHTML(initial) + '</div>' +
          '<div class="profile-name">' + escapeHTML(u.name) + (isMe ? ' <span class="you-tag">you</span>' : '') + '</div>' +
          '<div class="profile-stats-grid">' +
            '<div class="stat-tile"><div class="v">' + scoreList.length + '</div><div class="l">Scored</div></div>' +
            '<div class="stat-tile"><div class="v">' + totalPointsAwarded + '</div><div class="l">Points given</div></div>' +
            '<div class="stat-tile"><div class="v">' + theirComments.length + '</div><div class="l">Comments</div></div>' +
            '<div class="stat-tile"><div class="v">' + totalUpvotesReceived + '</div><div class="l">♥ received</div></div>' +
          '</div>' +
        '</div>' +
        '<section class="section">' +
          '<div class="section-label">' + (isMe ? 'Your scores' : 'Their scores') + ' (' + scoreList.length + ')</div>' +
          '<div class="profile-scores">' + scoresHTML + '</div>' +
        '</section>' +
        '<section class="section">' +
          '<div class="section-label">' + (isMe ? 'Your hot takes' : 'Their hot takes') + ' (' + theirComments.length + ')</div>' +
          '<div class="profile-comments">' + commentsHTML + '</div>' +
        '</section>' +
        (isMe ?
          '<section class="section">' +
            '<div class="section-label">Comments you liked (' + upvotesGiven + ')</div>' +
            '<div class="profile-comments">' + upvotedCommentsHTML + '</div>' +
          '</section>' : '') +
        (logoutHTML ? '<div class="section" style="padding-bottom:40px">' + logoutHTML + '</div>' : '') +
      '</main>';
  }

  function renderActivity() {
    var room = activeRoom();
    var feed = [];
    var c = room.comments;
    for (var ck in c) {
      feed.push({
        kind: 'comment',
        id: c[ck].id,
        userId: c[ck].userId,
        userName: c[ck].userName,
        country: c[ck].country,
        text: c[ck].text,
        createdAt: c[ck].createdAt
      });
    }

    var se = room.scoreEvents || {};
    for (var sk in se) {
      feed.push({
        kind: 'score',
        id: se[sk].id,
        userId: se[sk].userId,
        userName: se[sk].userName,
        country: se[sk].country,
        points: se[sk].points,
        prev: se[sk].prev,
        createdAt: se[sk].createdAt
      });
    }

    feed.sort(function(a, b) { return b.createdAt - a.createdAt; });

    if (feed.length === 0) {
      return '<div class="empty"><div class="ico">💬</div><div class="ttl">Nothing yet</div><div class="sub">Score a country or post a hot take to get things moving.</div></div>';
    }

    var rowsHTML = feed.map(function(item, i) {
      var ctry = COUNTRIES_BY_CODE[item.country];
      if (!ctry) return '';
      var who = item.userId === state.user.id ? 'YOU' : escapeHTML(item.userName).toUpperCase();
      var delay = Math.min(i * 12, 400);

      if (item.kind === 'comment') {
        var likes = (room.comments[item.id] && room.comments[item.id].likes) || {};
        var likeCount = 0;
        for (var lk in likes) likeCount++;
        var heartHTML = likeCount > 0 ? '<span class="act-hearts">♥ ' + likeCount + '</span>' : '';
        return '' +
          '<button class="act-card fade" data-country="' + ctry.code + '" style="animation-delay:' + delay + 'ms">' +
            '<div class="act-row">' +
              '<div class="act-flag">' + ctry.flag + '</div>' +
              '<div class="act-body">' +
                '<div class="act-head">' +
                  '<span class="act-author">' + who + '</span>' +
                  '<span class="act-on">on <span class="ct">' + escapeHTML(ctry.name) + '</span></span>' +
                  '<span class="act-time">' + formatRel(item.createdAt) + '</span>' +
                '</div>' +
                '<div class="act-text">' + escapeHTML(item.text) + '</div>' +
                (heartHTML ? '<div class="act-foot">' + heartHTML + '</div>' : '') +
              '</div>' +
            '</div>' +
          '</button>';
      }

      var isDouze = item.points === 12;
      var verb = item.prev != null && item.prev !== item.points ? 'updated to' : 'gave';
      var pointsHTML = '<span class="act-pts' + (isDouze ? ' douze' : '') + '">' + item.points + ' pt' + (item.points === 1 ? '' : 's') + '</span>';
      return '' +
        '<button class="act-card fade act-score" data-country="' + ctry.code + '" style="animation-delay:' + delay + 'ms">' +
          '<div class="act-row">' +
            '<div class="act-flag">' + ctry.flag + '</div>' +
            '<div class="act-body">' +
              '<div class="act-head">' +
                '<span class="act-author">' + who + '</span>' +
                '<span class="act-on">' + verb + ' ' + pointsHTML + ' to <span class="ct">' + escapeHTML(ctry.name) + '</span></span>' +
                '<span class="act-time">' + formatRel(item.createdAt) + '</span>' +
              '</div>' +
            '</div>' +
          '</div>' +
        '</button>';
    }).join('');

    return '<div class="activity-wrap">' + rowsHTML + '</div>';
  }

  function renderCountryDetail() {
    var room = activeRoom();
    var country = state.activeCountry;
    var byCountry = pivotScores();
    var sMap = byCountry[country.code] || {};
    var allEntries = [];
    for (var uid in sMap) {
      allEntries.push({
        uid: uid,
        score: sMap[uid],
        name: (room.users[uid] && room.users[uid].name) || uid
      });
    }
    allEntries.sort(function(a, b) { return b.score - a.score; });

    var total = 0;
    for (var i = 0; i < allEntries.length; i++) total += allEntries[i].score;
    var avg = allEntries.length ? (total / allEntries.length) : 0;
    var myScore = sMap[state.user.id] != null ? sMap[state.user.id] : null;

    var statsHTML = '';
    if (allEntries.length > 0) {
      statsHTML =
        '<div class="stats-row">' +
          '<div class="stat-tile"><div class="v">' + total + '</div><div class="l">Total</div></div>' +
          '<div class="stat-tile"><div class="v">' + avg.toFixed(1) + '</div><div class="l">Average</div></div>' +
          '<div class="stat-tile"><div class="v">' + allEntries.length + '</div><div class="l">Voters</div></div>' +
        '</div>';
    }

    var metaHTML;
    if (country.artist === 'TBA') metaHTML = '<div class="hero-meta" style="opacity:0.4;font-style:italic">artist tba</div>';
    else metaHTML = '<div class="hero-meta"><span style="font-weight:700">' + escapeHTML(country.artist) + '</span>' + (country.song !== 'TBA' ? '<span class="song"> · "' + escapeHTML(country.song) + '"</span>' : '') + '</div>';

    var pointsHTML = POINTS.map(function(pts) {
      var cls = 'score-btn';
      if (pts === 12) cls += ' douze';
      if (myScore === pts) cls += ' selected';
      return '<button class="' + cls + '" data-score="' + pts + '">' + pts + '</button>';
    }).join('');

    var clearHTML = myScore !== null ? '<button class="clear-btn" data-clear-score>Clear my score</button>' : '';

    var votersHTML = '';
    if (allEntries.length > 0) {
      var pillsHTML = allEntries.map(function(e) {
        var isMe = e.uid === state.user.id;
        var ptsCls = 'pts' + (e.score === 12 ? ' douze' : '');
        return '<button class="voter-pill pop' + (isMe ? ' me' : '') + '" data-profile="' + escapeHTML(e.uid) + '">' +
                 '<span class="nm">' + escapeHTML(e.name) + '</span>' +
                 '<span class="' + ptsCls + '">' + e.score + '</span>' +
               '</button>';
      }).join('');
      votersHTML =
        '<section class="section">' +
          '<div class="section-label">How everyone scored</div>' +
          '<div class="voters-row">' + pillsHTML + '</div>' +
        '</section>';
    }

    var allCmts = room.comments;
    var cmts = [];
    for (var ck in allCmts) if (allCmts[ck].country === country.code) cmts.push(allCmts[ck]);
    cmts.sort(function(a, b) { return b.createdAt - a.createdAt; });

    var cmtsHTML;
    if (cmts.length === 0) {
      cmtsHTML = '<div class="cmt-empty">Nothing yet. Be the first to drop an opinion.</div>';
    } else {
      cmtsHTML = cmts.map(function(cm) {
        var nm = cm.userId === state.user.id ? 'YOU' : escapeHTML(cm.userName).toUpperCase();
        var del = cm.userId === state.user.id ? '<button class="cmt-del" data-del-cmt="' + cm.id + '">delete</button>' : '';
        var likes = cm.likes || {};
        var likeCount = 0;
        for (var lk in likes) likeCount++;
        var iLiked = !!likes[state.user.id];
        var likeBtn = '<button class="cmt-like' + (iLiked ? ' liked' : '') + '" data-like-cmt="' + cm.id + '" aria-label="Like comment">' +
          '<svg viewBox="0 0 24 24" width="14" height="14" fill="' + (iLiked ? 'currentColor' : 'none') + '" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
            '<path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>' +
          '</svg>' +
          (likeCount > 0 ? '<span class="cmt-like-count">' + likeCount + '</span>' : '') +
        '</button>';
        return '' +
          '<div class="cmt-card fade">' +
            '<div class="cmt-head">' +
              '<span class="cmt-name">' + nm + '</span>' +
              '<span class="cmt-time">' + formatRel(cm.createdAt) + '</span>' +
              del +
            '</div>' +
            '<div class="cmt-text">' + escapeHTML(cm.text) + '</div>' +
            '<div class="cmt-foot">' + likeBtn + '</div>' +
          '</div>';
      }).join('');
    }

    var draftLen = state.draftComment.length;
    var counterHTML = draftLen > 200 ? '<div class="cmt-counter">' + (280 - draftLen) + ' left</div>' : '';

    var videoHTML = '';
    if (country.youtube) {
      var watchOnYT = 'https://youtu.be/' + encodeURIComponent(country.youtube);
      videoHTML =
        '<section class="section video-section">' +
          '<a href="' + watchOnYT + '" target="_blank" rel="noopener" class="video-toggle">' +
            '<div class="video-toggle-left">' +
              '<svg class="video-play-ico" viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>' +
              '<div>' +
                '<div class="video-toggle-title">Watch on YouTube</div>' +
                '<div class="video-toggle-sub">' + escapeHTML(country.artist) + ' · ' + escapeHTML(country.song) + '</div>' +
              '</div>' +
            '</div>' +
            '<svg class="video-chevron" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>' +
          '</a>' +
        '</section>';
    }

    return '' +
      '<header class="header">' +
        '<div class="detail-header">' +
          '<button id="back-btn" class="icon-btn" aria-label="Back">' +
            '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>' +
          '</button>' +
          '<div class="detail-header-title"><span class="run-tag">#' + (country.running || '?') + '</span><span style="font-size:22px">' + country.flag + '</span><span class="name">' + escapeHTML(country.name) + '</span></div>' +
        '</div>' +
      '</header>' +
      '<main>' +
        '<div class="hero fade">' +
          '<div class="hero-flag">' + country.flag + '</div>' +
          '<h1 class="hero-name text-gradient">' + escapeHTML(country.name) + '</h1>' +
          metaHTML +
          statsHTML +
        '</div>' +
        videoHTML +
        '<section class="section fade" style="animation-delay:60ms">' +
          '<div class="section-label">Your verdict</div>' +
          '<div class="score-grid">' + pointsHTML + '</div>' +
          clearHTML +
        '</section>' +
        votersHTML +
        '<section class="section fade" style="animation-delay:140ms">' +
          '<div class="section-label">Hot takes (' + cmts.length + ')</div>' +
          '<div class="cmt-list">' + cmtsHTML + '</div>' +
        '</section>' +
      '</main>' +
      '<div class="cmt-bar">' +
        '<div class="cmt-bar-inner">' +
          '<textarea id="cmt-input" class="cmt-input" rows="1" maxlength="280" placeholder="Comment on ' + escapeHTML(country.name) + '…">' + escapeHTML(state.draftComment) + '</textarea>' +
          '<button id="cmt-post" class="cmt-post"' + (state.draftComment.trim() ? '' : ' disabled') + '>Post</button>' +
        '</div>' +
        counterHTML +
      '</div>';
  }

  function bindEvents() {
    var $lobbyCreate = document.getElementById('lobby-create');
    if ($lobbyCreate) $lobbyCreate.addEventListener('click', function() {
      state.lobbyStage = 'create';
      state.lobbyError = '';
      render();
    });

    var $lobbyJoin = document.getElementById('lobby-join');
    if ($lobbyJoin) $lobbyJoin.addEventListener('click', function() {
      state.lobbyStage = 'join';
      state.lobbyError = '';
      render();
    });

    var $backChoose = document.getElementById('back-to-choose');
    if ($backChoose) $backChoose.addEventListener('click', function() {
      state.lobbyStage = 'choose';
      state.lobbyError = '';
      state.pendingRoomCode = null;
      render();
    });

    var $roomNameIn = document.getElementById('room-name-input');
    var $createGo = document.getElementById('create-go');
    if ($roomNameIn && $createGo) {
      $roomNameIn.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') { e.preventDefault(); createRoom($roomNameIn.value); }
      });
      $createGo.addEventListener('click', function() { createRoom($roomNameIn.value); });
      setTimeout(function() { try { $roomNameIn.focus(); } catch (e) {} }, 30);
    }

    var $roomCodeIn = document.getElementById('room-code-input');
    var $joinGo = document.getElementById('join-go');
    if ($roomCodeIn && $joinGo) {
      $roomCodeIn.addEventListener('input', function() {
        var pos = $roomCodeIn.selectionStart;
        $roomCodeIn.value = $roomCodeIn.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
        try { $roomCodeIn.setSelectionRange(pos, pos); } catch (e) {}
        $joinGo.disabled = !$roomCodeIn.value.trim();
        if (state.lobbyError) state.lobbyError = '';
      });
      $roomCodeIn.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') { e.preventDefault(); joinRoom($roomCodeIn.value); }
      });
      $joinGo.addEventListener('click', function() { joinRoom($roomCodeIn.value); });
      setTimeout(function() { try { $roomCodeIn.focus(); } catch (e) {} }, 30);
    }

    var $leaveBtn = document.getElementById('leave-room-btn');
    if ($leaveBtn) $leaveBtn.addEventListener('click', function() {
      if (confirm('Leave this room? Your scores stay saved here for if you come back.')) {
        leaveRoom();
      }
    });

    var $lobbyLeave = document.getElementById('lobby-leave-room');
    if ($lobbyLeave) $lobbyLeave.addEventListener('click', function() {
      leaveRoom();
    });

    var $share = document.getElementById('share-room');
    if ($share) $share.addEventListener('click', function() {
      var url = window.location.origin + window.location.pathname + '#' + state.activeRoomCode;
      var shareText = 'Join my Eurovision room — code ' + state.activeRoomCode + '\n' + url;
      if (navigator.share) {
        navigator.share({ title: 'Eurovision room', text: shareText, url: url }).catch(function() {});
      } else if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(shareText).then(function() {
          alert('Room link copied to clipboard.');
        }).catch(function() {
          prompt('Copy this link:', url);
        });
      } else {
        prompt('Copy this link:', url);
      }
    });

    var $name = document.getElementById('name-input');
    var $join = document.getElementById('join-btn');
    if ($name && $join) {
      $name.addEventListener('input', function() {
        $join.disabled = !$name.value.trim();
      });
      $name.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') { e.preventDefault(); joinUser($name.value); }
      });
      $join.addEventListener('click', function() { joinUser($name.value); });
    }

    var resumes = document.querySelectorAll('[data-resume]');
    for (var i = 0; i < resumes.length; i++) {
      (function(el) {
        el.addEventListener('click', function() {
          var uid = el.getAttribute('data-resume');
          var u = activeRoom().users[uid];
          if (u) resumeUser(u);
        });
      })(resumes[i]);
    }

    var $reset = document.getElementById('reset-demo');
    if ($reset) $reset.addEventListener('click', function() {
      if (confirm('Reset demo data back to seeded state?')) resetStore();
    });

    var $home = document.getElementById('home-btn');
    if ($home) $home.addEventListener('click', function() {
      logout();
      window.scrollTo(0, 0);
    });

    var $profile = document.getElementById('profile-btn');
    if ($profile) $profile.addEventListener('click', function() {
      state.profileUserId = state.user.id;
      state.view = 'profile';
      render();
      window.scrollTo(0, 0);
    });

    var tabs = document.querySelectorAll('[data-tab]');
    for (var t = 0; t < tabs.length; t++) {
      (function(el) {
        el.addEventListener('click', function() {
          state.tab = el.getAttribute('data-tab');
          render();
        });
      })(tabs[t]);
    }

    var subtabs = document.querySelectorAll('[data-board-tab]');
    for (var st = 0; st < subtabs.length; st++) {
      (function(el) {
        el.addEventListener('click', function() {
          state.boardTab = el.getAttribute('data-board-tab');
          render();
        });
      })(subtabs[st]);
    }

    var openers = document.querySelectorAll('[data-country]');
    for (var o = 0; o < openers.length; o++) {
      (function(el) {
        el.addEventListener('click', function() {
          var cc = el.getAttribute('data-country');
          var ctry = COUNTRIES_BY_CODE[cc];
          if (ctry) {
            state.activeCountry = ctry;
            state.view = 'country';
            state.draftComment = '';
            render();
            window.scrollTo(0, 0);
          }
        });
      })(openers[o]);
    }

    var $back = document.getElementById('back-btn');
    if ($back) $back.addEventListener('click', function() {
      state.view = 'main';
      render();
      window.scrollTo(0, 0);
    });

    var $logout = document.getElementById('logout-btn');
    if ($logout) $logout.addEventListener('click', function() {
      if (confirm('Sign out? Your scores stay saved — you can resume by tapping your name on the welcome screen.')) {
        logout();
      }
    });

    var profileOpeners = document.querySelectorAll('[data-profile]');
    for (var pi = 0; pi < profileOpeners.length; pi++) {
      (function(el) {
        el.addEventListener('click', function() {
          state.profileUserId = el.getAttribute('data-profile');
          state.view = 'profile';
          render();
          window.scrollTo(0, 0);
        });
      })(profileOpeners[pi]);
    }

    var scoreBtns = document.querySelectorAll('[data-score]');
    for (var s = 0; s < scoreBtns.length; s++) {
      (function(el) {
        el.addEventListener('click', function() {
          var pts = parseInt(el.getAttribute('data-score'), 10);
          var byCountry = pivotScores();
          var current = (byCountry[state.activeCountry.code] || {})[state.user.id];
          setScore(state.activeCountry.code, current === pts ? null : pts);
        });
      })(scoreBtns[s]);
    }

    var $clear = document.querySelector('[data-clear-score]');
    if ($clear) $clear.addEventListener('click', function() { setScore(state.activeCountry.code, null); });

    var $cmtIn = document.getElementById('cmt-input');
    var $cmtPost = document.getElementById('cmt-post');
    if ($cmtIn && $cmtPost) {
      $cmtIn.addEventListener('input', function() {
        state.draftComment = $cmtIn.value;
        $cmtPost.disabled = !$cmtIn.value.trim();
        $cmtIn.style.height = 'auto';
        $cmtIn.style.height = Math.min($cmtIn.scrollHeight, 100) + 'px';
      });
      $cmtIn.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          if ($cmtIn.value.trim()) postComment(state.activeCountry.code, $cmtIn.value);
        }
      });
      $cmtPost.addEventListener('click', function() {
        if ($cmtIn.value.trim()) postComment(state.activeCountry.code, $cmtIn.value);
      });
    }

    var dels = document.querySelectorAll('[data-del-cmt]');
    for (var d = 0; d < dels.length; d++) {
      (function(el) {
        el.addEventListener('click', function() {
          var cid = el.getAttribute('data-del-cmt');
          deleteComment(cid);
        });
      })(dels[d]);
    }

    var likes = document.querySelectorAll('[data-like-cmt]');
    for (var lk = 0; lk < likes.length; lk++) {
      (function(el) {
        el.addEventListener('click', function(e) {
          e.stopPropagation();
          var cid = el.getAttribute('data-like-cmt');
          toggleLike(cid);
        });
      })(likes[lk]);
    }
  }

  async function boot() {
    var hashRoom = readHashRoom();
    var sessionRoom = loadSessionRoom();
    var candidate = hashRoom || sessionRoom;

    if (candidate) {
      try {
        var room = await fetchRoomFromCloud(candidate);
        if (room) {
          if (!state.store.rooms) state.store.rooms = {};
          state.store.rooms[candidate] = room;
          state.activeRoomCode = candidate;
          startRoomSubscription();
          saveSessionRoom(candidate);
          writeHashRoom(candidate);
        } else if (hashRoom) {
          state.lobbyStage = 'join';
          state.pendingRoomCode = hashRoom;
        }
      } catch (e) {
        console.error(e);
      }
    }

    if (state.user && state.activeRoomCode && activeRoom() && activeRoom().users[state.user.id]) {
      state.view = 'main';
    } else if (state.activeRoomCode) {
      state.user = null;
      clearSessionUser();
      state.lobbyStage = 'name';
      state.view = 'welcome';
    } else {
      state.user = null;
      clearSessionUser();
      state.view = 'welcome';
    }

    render();
    window.__esc26 = { state: state, reset: resetStore };
  }

  boot();
})();
</script>
